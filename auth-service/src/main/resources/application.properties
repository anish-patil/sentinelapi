spring.application.name=auth-service
server.port=8081

# PostgreSQL (docker-compose.yml at the repo root); override with env vars elsewhere
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/sentinel}
spring.datasource.username=${DB_USER:sentinel}
spring.datasource.password=${DB_PASSWORD:sentinel}
# shortcut: Hibernate manages the schema, switch to Flyway migrations before the schema needs to evolve with real data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Kafka: JSON events without Java type headers so other services can read them
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# fail fast instead of hanging a login for 60s when Kafka is down
spring.kafka.producer.properties.max.block.ms=2000
sentinel.kafka.auth-events-topic=auth-events

sentinel.jwt.issuer=sentinelapi-auth
sentinel.jwt.ttl=15m

management.endpoints.web.exposure.include=health
