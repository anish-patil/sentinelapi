# Local infrastructure for SentinelAPI. Ollama runs natively on the host (port 11434).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel # local dev only
    ports:
      - "5433:5432" # 5432 is taken by a local PostgreSQL service
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0 # single-node KRaft broker, no ZooKeeper
    ports:
      - "9092:9092"

  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  pgdata:
